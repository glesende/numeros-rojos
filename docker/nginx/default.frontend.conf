# Crawlers de redes sociales (no ejecutan JS): reciben el HTML con og:tags de la página
# desde la API (ShareController). Googlebot/Bingbot quedan afuera: renderizan la SPA y ya leen su JSON-LD.
map $http_user_agent $nr_social_crawler {
    default 0;
    ~*(facebookexternalhit|facebot|twitterbot|whatsapp|telegrambot|linkedinbot|slackbot|slack-imgproxy|discordbot|pinterest|skypeuripreview|redditbot|embedly|vkshare|bot-instagram|meta-externalagent) 1;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 10M;

    # El contenedor está detrás de un proxy que termina HTTPS y le reenvía en
    # HTTP simple; sin esto, los 301 automáticos de nginx (ej. /contratos ->
    # /contratos/) se arman como http://, lo que rompe las previews de
    # WhatsApp/Facebook/Twitter al no seguir un downgrade HTTPS->HTTP.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # PoC oculta de accesos al estadio (#372): nunca indexable, sin caché, cámara permitida solo al propio origen.
    location ~ ^/estadio-accesos/?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header Permissions-Policy "camera=(self)" always;
        try_files /estadio-accesos/index.html /index.html;
    }

    # Modelos faciales de la PoC: inmutables por versión del paquete, cacheables.
    location /poc-modelos-facial/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # Detalle de balance / contrato / lista de elecciones: a los crawlers sociales les sirve la tarjeta.
    location ~ ^/(balances|contratos|elecciones)/([^/]+)/?$ {
        set $share_path /api/v1/share/$1/$2;
        if ($nr_social_crawler) {
            rewrite ^ $share_path break;
            proxy_pass http://api:80;
        }
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:9000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120;
        proxy_send_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
